<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Status - Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <h1><i class="fas fa-calendar-check"></i> Leave Management System</h1>
        </div>
        <div class="header-right">
                <span class="user-info">
                    <i class="fas fa-user"></i>
                    <span th:text="${employee.name}">Employee Name</span>
                </span>
            <a th:href="@{/logout}" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="dashboard-nav">
        <a th:href="@{/employee/dashboard}" class="nav-link">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="#" class="nav-link active">
            <i class="fas fa-list"></i> Leave Status
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-user"></i> Profile
        </a>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-content">
        <div class="leave-status-section">
            <h2>Leave Application Status</h2>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterApplications('all')">
                    <i class="fas fa-list"></i> All
                </button>
                <button class="filter-btn" onclick="filterApplications('Pending')">
                    <i class="fas fa-clock"></i> Pending
                </button>
                <button class="filter-btn" onclick="filterApplications('Approved')">
                    <i class="fas fa-check"></i> Approved
                </button>
                <button class="filter-btn" onclick="filterApplications('Rejected')">
                    <i class="fas fa-times"></i> Rejected
                </button>
            </div>

            <!-- Applications List -->
            <div class="applications-list">
                <div th:if="${#lists.isEmpty(applications)}" class="no-applications">
                    <i class="fas fa-inbox"></i>
                    <p>No leave applications found</p>
                </div>

                <div th:each="app : ${applications}"
                     class="application-item"
                     th:attr="data-status=${app.status}">
                    <div class="app-details">
                        <div class="app-header">
                            <h3>
                                <i class="fas"
                                   th:classappend="${app.leaveType.typeName == 'Annual'} ? 'fa-umbrella-beach' :
                                                      (${app.leaveType.typeName == 'Sick'} ? 'fa-hospital' : 'fa-home')"></i>
                                <span th:text="${app.leaveType.typeName}">Leave Type</span>
                            </h3>
                            <span class="status-badge"
                                  th:classappend="${app.status == 'Pending'} ? 'badge-pending' :
                                                     (${app.status == 'Approved'} ? 'badge-approved' : 'badge-rejected')"
                                  th:text="${app.status}">Status</span>
                        </div>
                        <div class="app-info-grid">
                            <div class="info-item">
                                <i class="fas fa-calendar-alt"></i>
                                <span>
                                        <strong>Period:</strong>
                                        <span th:text="${#temporals.format(app.startDate, 'dd MMM yyyy')}">Start</span> -
                                        <span th:text="${#temporals.format(app.endDate, 'dd MMM yyyy')}">End</span>
                                    </span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-clock"></i>
                                <span>
                                        <strong>Duration:</strong>
                                        <span th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(app.startDate, app.endDate) + 1}">0</span> days
                                    </span>
                            </div>
                            <div class="info-item full-width">
                                <i class="fas fa-comment"></i>
                                <span>
                                        <strong>Reason:</strong>
                                        <span th:text="${app.reason}">Reason</span>
                                    </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function filterApplications(status) {
        const applications = document.querySelectorAll('.application-item');
        const buttons = document.querySelectorAll('.filter-btn');

        // Update active button
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Filter applications
        applications.forEach(app => {
            if (status === 'all' || app.dataset.status === status) {
                app.style.display = 'block';
            } else {
                app.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
