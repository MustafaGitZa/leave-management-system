<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <h1><i class="fas fa-calendar-check"></i> Leave Management System</h1>
        </div>
        <div class="header-right">
                <span class="user-info">
                    <i class="fas fa-user"></i>
                    <span th:text="${employee.name}">Employee Name</span>
                </span>
            <a th:href="@{/logout}" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="dashboard-nav">
        <a href="#" class="nav-link active">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a th:href="@{/employee/leave-status}" class="nav-link">
            <i class="fas fa-list"></i> Leave Status
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-user"></i> Profile
        </a>
    </nav>

    <!-- Success Message -->
    <div th:if="${param.success}" class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i> Leave application submitted successfully!
    </div>

    <!-- Main Content -->
    <div class="dashboard-content">
        <!-- Leave Balance Cards -->
        <h2>Leave Balance</h2>
        <div class="balance-grid">
            <div th:each="balance : ${balances}" class="balance-card"
                 th:classappend="${balance.leaveType.typeName == 'Annual'} ? 'balance-annual' :
                                     (${balance.leaveType.typeName == 'Sick'} ? 'balance-sick' : 'balance-family')">
                <div class="balance-icon">
                    <i class="fas"
                       th:classappend="${balance.leaveType.typeName == 'Annual'} ? 'fa-umbrella-beach' :
                                          (${balance.leaveType.typeName == 'Sick'} ? 'fa-hospital' : 'fa-home')"></i>
                </div>
                <div class="balance-info">
                    <h3 th:text="${balance.leaveType.typeName}">Leave Type</h3>
                    <p class="balance-days">
                        <span th:text="${balance.remainingDays}">0</span> /
                        <span th:text="${balance.totalDays}">0</span> days
                    </p>
                    <div class="progress-bar">
                        <div class="progress-fill"
                             th:style="'width: ' + ${balance.remainingDays * 100 / balance.totalDays} + '%'"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Apply for Leave -->
        <div class="apply-leave-section">
            <h2>Apply for Leave</h2>
            <form th:action="@{/employee/apply-leave}" method="post" id="leaveForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="leaveType">
                            <i class="fas fa-tag"></i> Leave Type
                        </label>
                        <select id="leaveType" name="leaveType.typeId" required>
                            <option value="">Select Leave Type</option>
                            <option th:each="type : ${leaveTypes}"
                                    th:value="${type.typeId}"
                                    th:text="${type.typeName}">Leave Type</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="startDate">
                            <i class="fas fa-calendar"></i> Start Date
                        </label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>

                    <div class="form-group">
                        <label for="endDate">
                            <i class="fas fa-calendar"></i> End Date
                        </label>
                        <input type="date" id="endDate" name="endDate" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="reason">
                            <i class="fas fa-comment"></i> Reason
                        </label>
                        <textarea id="reason" name="reason" rows="3" required></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Submit Application
                </button>
            </form>
        </div>

        <!-- Recent Applications -->
        <div class="recent-applications">
            <h2>Recent Applications</h2>
            <div class="applications-list">
                <div th:if="${#lists.isEmpty(recentApplications)}" class="no-applications">
                    <i class="fas fa-inbox"></i>
                    <p>No recent applications</p>
                </div>

                <div th:each="app : ${recentApplications}" class="application-item">
                    <div class="app-info">
                        <h4 th:text="${app.leaveType.typeName}">Leave Type</h4>
                        <p>
                            <i class="fas fa-calendar"></i>
                            <span th:text="${#temporals.format(app.startDate, 'dd MMM yyyy')}">Start</span> -
                            <span th:text="${#temporals.format(app.endDate, 'dd MMM yyyy')}">End</span>
                        </p>
                    </div>
                    <span class="status-badge"
                          th:classappend="${app.status == 'Pending'} ? 'badge-pending' :
                                             (${app.status == 'Approved'} ? 'badge-approved' : 'badge-rejected')"
                          th:text="${app.status}">Status</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').setAttribute('min', today);
    document.getElementById('endDate').setAttribute('min', today);

    // Update end date min when start date changes
    document.getElementById('startDate').addEventListener('change', function() {
        document.getElementById('endDate').setAttribute('min', this.value);
    });

    // Show success message and hide after 5 seconds
    const successMsg = document.getElementById('successMessage');
    if (successMsg) {
        setTimeout(() => {
            successMsg.style.display = 'none';
        }, 5000);
    }

    // Form submission
    document.getElementById('leaveForm').addEventListener('submit', function() {
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
        submitBtn.disabled = true;
    });
</script>
</body>
</html>
