<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Apply for Leave</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="header">
    <h1>Apply for Leave</h1>
    <a href="/employee/dashboard" class="btn btn-danger">Back</a>
</header>

<div class="container">
    <div class="card">

        <form>
            <div class="form-grid">

                <div class="form-group">
                    <label>Leave Type</label>
                    <select>
                        <option>Annual</option>
                        <option>Sick</option>
                        <option>Family</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>End Date</label>
                    <input type="date">
                </div>

            </div>

            <label>Reason</label>
            <textarea></textarea>

            <button class="btn btn-success btn-submit">Submit Application</button>
        </form>

    </div>
</div>

</body>
</html>
